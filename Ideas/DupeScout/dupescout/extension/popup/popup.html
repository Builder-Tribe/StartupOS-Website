<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DupeScout — Find Dupes</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            <circle cx="11" cy="11" r="3" fill="#f43f5e"></circle>
          </svg>
        </div>
        <div class="brand-text">
          <h1>DupeScout</h1>
          <span class="tagline">Shop the Look. Not the Markup.</span>
        </div>
      </div>
      <button id="btn-open-sidepanel" class="icon-btn" title="Open Visual Side Panel">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>
    </header>

    <!-- Search Input Box -->
    <section class="search-box">
      <div class="input-wrapper">
        <input type="text" id="search-input" placeholder="Paste product URL or search term..." />
        <button id="btn-search" class="search-submit-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <div class="actions-row">
        <label for="image-file-input" class="upload-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          Upload Image
        </label>
        <input type="file" id="image-file-input" accept="image/*" style="display:none;" />
        <button id="btn-active-tab-scan" class="scan-page-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          Scan Active Tab
        </button>
      </div>
    </section>

    <!-- Main Content State -->
    <main id="content-area">
      <!-- Loading Spinner -->
      <div id="loading-state" class="state-container hidden">
        <div class="spinner"></div>
        <p>Analyzing visual features with CLIP AI...</p>
        <span class="sub-text">Scanning DupeScout index for lower-priced alternatives</span>
      </div>

      <!-- Search Results View -->
      <div id="results-state" class="state-container hidden">
        <div class="results-header">
          <span id="results-count" class="badge">0 Dupes Found</span>
          <button id="btn-view-sidepanel-link" class="text-link">Full Comparison &rarr;</button>
        </div>
        <div id="dupes-list" class="cards-list"></div>
      </div>

      <!-- Recent Searches View -->
      <div id="history-state" class="state-container">
        <div class="section-title">
          <span>Recent Searches</span>
          <button id="btn-clear-history" class="clear-btn">Clear</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>DupeScout API: <strong id="api-status">Connected</strong></span>
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
